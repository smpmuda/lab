<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Mengajar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0f1f3d;
    --navy2: #1a3260;
    --blue: #2563eb;
    --blue-l: #dbeafe;
    --sky: #e8f0fe;
    --green: #16a34a;
    --green-l: #dcfce7;
    --amber: #d97706;
    --amber-l: #fef3c7;
    --red: #dc2626;
    --red-l: #fee2e2;
    --white: #ffffff;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-600: #475569;
    --gray-800: #1e293b;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  }

  html, body {
    height: 100%;
    background: var(--gray-50);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--gray-800);
    font-size: 15px;
    padding-bottom: 76px; /* ruang untuk bottom nav mobile */
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ── HEADER ── */
  .topbar {
    background: var(--navy);
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }

  .topbar-logo {
    width: 30px; height: 30px;
    background: white;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--navy); font-size: 13px;
    flex-shrink: 0;
  }

  .topbar-title { flex: 1; }
  .topbar-name { font-size: 14px; font-weight: 700; }
  .topbar-user { font-size: 11px; color: rgba(255,255,255,.6); }

  .topbar-logout {
    background: rgba(255,255,255,.12);
    border: none;
    color: white;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  /* ── ROLE SWITCHER (untuk multi-role) ── */
  .role-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    background: white;
    border-bottom: 1px solid var(--gray-200);
    overflow-x: auto;
  }
  .role-tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    border: 1.5px solid var(--gray-200);
    background: white;
    color: var(--gray-600);
  }
  .role-tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }

  /* ── MAIN CONTAINER ── */
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px;
  }

  /* ── DATE BAR ── */
  .date-bar {
    background: white;
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .date-bar input[type="date"] {
    border: none;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    font-family: inherit;
    flex: 1;
  }
  .date-today-btn {
    background: var(--sky);
    color: var(--blue);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
  }

  /* ── SECTION TITLE ── */
  .sec-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-600);
    margin: 20px 0 10px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .sec-title:first-child { margin-top: 0; }

  /* ── JADWAL CARD ── */
  .jadwal-card {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
    border-left: 4px solid var(--gray-300);
  }
  .jadwal-card.done { border-left-color: var(--green); }
  .jadwal-card.konflik { border-left-color: var(--amber); }

  .jadwal-top {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .jadwal-info { flex: 1; min-width: 0; }
  .jadwal-mapel { font-size: 15px; font-weight: 700; color: var(--navy); }
  .jadwal-meta { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-done { background: var(--green-l); color: var(--green); }
  .badge-todo { background: var(--gray-100); color: var(--gray-600); }
  .badge-konflik { background: var(--amber-l); color: var(--amber); }

  .jadwal-warn {
    background: var(--amber-l);
    color: var(--amber);
    font-size: 12px;
    padding: 8px 16px;
    font-weight: 600;
  }

  .jadwal-preview {
    background: var(--gray-50);
    border-top: 1px solid var(--gray-200);
    padding: 10px 16px;
    font-size: 12px;
    color: var(--gray-600);
  }

  .pill-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px;
  }
  .pill-g { background: var(--green-l); color: var(--green); }
  .pill-s { background: var(--amber-l); color: var(--amber); }
  .pill-i { background: var(--sky); color: var(--blue); }
  .pill-a { background: var(--red-l); color: var(--red); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--gray-400);
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* ── FORM (Jurnal) ── */
  .form-box {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .form-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--gray-600);
    margin-bottom: 6px;
    display: block;
  }
  .form-group { margin-bottom: 18px; }
  .form-readonly {
    background: var(--gray-50);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--blue); }

  .jam-check-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .jam-check {
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-600);
    background: white;
  }
  .jam-check.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  /* ── SISWA LIST (kehadiran) ── */
  .siswa-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .siswa-row:last-child { border-bottom: none; }
  .siswa-nama { flex: 1; font-size: 14px; font-weight: 600; }
  .siswa-nis { font-size: 11px; color: var(--gray-400); }

  .status-btns { display: flex; gap: 4px; }
  .status-btn {
    border: 1.5px solid var(--gray-200);
    background: white;
    color: var(--gray-400);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 6px;
  }
  .status-btn.active-h { background: var(--green); border-color: var(--green); color: white; }
  .status-btn.active-s { background: var(--amber); border-color: var(--amber); color: white; }
  .status-btn.active-i { background: var(--blue); border-color: var(--blue); color: white; }
  .status-btn.active-a { background: var(--red); border-color: var(--red); color: white; }

  /* ── BUTTONS ── */
  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 8px;
  }
  .btn-primary:disabled { opacity: .5; }
  .btn-secondary {
    width: 100%;
    background: var(--gray-100);
    color: var(--gray-600);
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
  }
  .btn-back {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 14px;
    font-weight: 700;
    padding: 4px 0 16px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid var(--gray-200);
    display: flex;
    z-index: 60;
    box-shadow: 0 -2px 12px rgba(0,0,0,.06);
  }
  .nav-item {
    flex: 1;
    text-align: center;
    padding: 10px 4px 8px;
    font-size: 10px;
    font-weight: 700;
    color: var(--gray-400);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .nav-item.active { color: var(--blue); }
  .nav-icon { font-size: 19px; }

  /* ── LOADING ── */
  .loading-box {
    text-align: center;
    padding: 40px;
    color: var(--gray-400);
    font-size: 13px;
  }
  .spinner {
    display: inline-block;
    width: 22px; height: 22px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ADMIN TABLE ── */
  .admin-list-item {
    background: white;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .admin-list-main { font-size: 14px; font-weight: 700; color: var(--navy); }
  .admin-list-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
  }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    background: white;
    border: 1.5px solid var(--gray-200);
    color: var(--gray-600);
    white-space: nowrap;
  }
  .filter-chip.active { background: var(--navy); border-color: var(--navy); color: white; }

  @media (min-width: 640px) {
    body { padding-bottom: 0; }
    .bottom-nav { display: none; }
    .container { padding: 24px 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="topbar">
  <div class="topbar-logo">M²</div>
  <div class="topbar-title">
    <div class="topbar-name" id="hdrAppName">Jurnal Mengajar</div>
    <div class="topbar-user" id="hdrUser">Memuat...</div>
  </div>
  <button class="topbar-logout" onclick="Auth.logout()">Keluar</button>
</div>

<!-- ROLE TABS (muncul jika multi-role) -->
<div class="role-tabs" id="roleTabs" style="display:none"></div>

<!-- MAIN CONTENT -->
<div class="container" id="mainContent">
  <div class="loading-box">
    <div class="spinner"></div><br>Memuat aplikasi...
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottomNav" style="display:none"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
